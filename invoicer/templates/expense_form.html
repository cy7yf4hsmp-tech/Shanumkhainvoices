{% extends "base.html" %}
{% block title %}Edit expense{% endblock %}
{% block content %}
<h1>Edit expense</h1>
<form method="post" class="card form">
  <div class="row">
    <label>Date<input type="date" name="date" value="{{ expense.date }}" required></label>
    <label>Type
      <select name="category">
        {% for c in categories %}<option {{ 'selected' if expense.category == c }}>{{ c }}</option>{% endfor %}
        {% if expense.category not in categories %}<option selected>{{ expense.category }}</option>{% endif %}
      </select>
    </label>
    <label>Amount (₹)<input type="number" name="amount" step="0.01" min="0.01" value="{{ expense.amount }}" required></label>
  </div>
  <div class="row">
    <label>Paid to<input name="paid_to" value="{{ expense.paid_to or '' }}"></label>
    <label>Paid by
      <select name="payment_mode">{% for m in modes %}<option {{ 'selected' if expense.payment_mode == m }}>{{ m }}</option>{% endfor %}</select>
    </label>
  </div>
  <label>Note<input name="note" value="{{ expense.note or '' }}"></label>
  <div class="actions">
    <button class="btn primary">Save</button>
    <a class="btn" href="{{ url_for('main.expenses', month=expense.date[:7]) }}">Cancel</a>
  </div>
</form>
{% endblock %}
