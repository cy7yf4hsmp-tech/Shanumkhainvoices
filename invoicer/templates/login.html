{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Log in</h1>
  <form method="post" class="card form">{{ csrf_field() }}
    <label>Username<input name="username" value="{{ username }}" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary big" style="width:100%">Log in</button>
  </form>
  <p class="muted small" style="text-align:center">Forgot your password? Ask the administrator to set a new one.</p>
</div>
{% endblock %}
